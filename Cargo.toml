[package]
name = "natus"
version = "0.1.0"
edition = "2021"
authors = ["Carson Barry <carsonbarry374@gmail.com>"]
description = "Natus — dictation and feedback capture tool (pure Rust, cross-platform)"
license = "MIT"
repository = "https://github.com/CarsonBarry/natus"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
cpal = "0.15"
hound = "3.5"
xcap = "0.9"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
arboard = "3"
rdev = "0.5"
enigo = "0.3"
global-hotkey = "0.6"
image = "0.25"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "natus"
path = "src/main.rs"

[package.metadata.packager]
product_name = "Natus"
identifier = "com.carsonbarry.natus"
out_dir = "target/release"
nsis = { installer_mode = "perMachine" }
